<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page externe</title>
</head>
<body>
    <h1>Page externe de l'atelier</h1>
    
    <!-- Exercice 18: Navigation interne avec ancres -->
    <nav>
        <h2>Sommaire</h2>
        <!-- À COMPLÉTER: Créer des liens vers les ancres -->
         <ul>
            <li><a href="#sectionA"></a></li>
            <li><a href="#sectionB"></a></li>
            <li><a href="#sectionC"></a></li>
         </ul>
    </nav>

    <!-- Exercice 19: Sections avec ancres -->
    <section>
        <!-- À COMPLÉTER: Créer des sections avec identifiants -->
            <h1 id="sectionA">SectionA</h1>
            <br>
            <h1 id="sectionB">SectionB</h1>
            <br>
            <h1 id="sectionC">SectionC</h1>

    </section>

    <!-- Exercice 20: Formulaire de recherche -->
    <section>
        <h2>Recherche</h2>
        <!-- À COMPLÉTER: Créer un formulaire de recherche -->
         <form action="https://www.google.com/?hl=fr&atvm=2" method="get">
            <label for="q">Rechercher sur Google</label>
            <input type="text" name="q" id="q">
            <button type="submit">Rechercher</button>
         </form>
    </section>

    <p><a href="../index.html">Retour à l'accueil</a></p>
</body>
</html>
